name: Update README with HTML links

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Triggered when this workflow finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # erlaubt dem Bot, Änderungen zurückzuschreiben

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Only run the job if the triggering workflow ("pages-build-deployment") was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate links
        run: |
          BASE_URL="https://armorednightmare.github.io/arcdps_shares"

          # 1. Alle .html-Dateien finden und den Git-Erstellungs-Timestamp abrufen
          #    --format=%ct: Committer-Zeit als Unix-Timestamp
          #    --diff-filter=A: Findet den Commit, in dem die Datei HINZUGEFÜGT (Added) wurde
          #    | tail -1: Nimmt nur den ältesten (ersten) Eintrag
          #    | sort -k1,1nr: Sortiert nach dem Timestamp (erste Spalte) in absteigender Reihenfolge (neueste zuerst)
          FILE_DATA=$(find . -type f -name "*.html" ! -path "./.git/*" | while read -r file; do
            # Entferne führendes ./ für den relativen Pfad
            relpath="${file#./}"
            
            # Hole den Unix-Timestamp des ersten Commits der Datei
            timestamp=$(git log --follow --format=%ct --diff-filter=A -- "$relpath" | tail -1)
            
            # Ausgabe: Timestamp, gefolgt vom relativen Pfad
            echo "$timestamp $relpath"
          done | sort -k1,1nr)

          # 2. Links aus den sortierten Daten generieren
          LINKS=$(echo "$FILE_DATA" | while read -r timestamp relpath; do
            # URL-kodierte Variante für den Link
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$relpath")
            echo "- [$relpath]($BASE_URL/$encoded)"
          done)

          # 3. Abschnitt im README ersetzen (Ihr AWK-Skript bleibt unverändert)
          awk -v links="$LINKS" '
            BEGIN {printlist=0}
            // {print; print links; printlist=1; next}
            // {printlist=0}
            !printlist {print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README with HTML links"
