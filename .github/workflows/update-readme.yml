name: Update README with HTML links

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Triggered when this workflow finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # erlaubt dem Bot, Änderungen zurückzuschreiben

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Only run the job if the triggering workflow ("pages-build-deployment") was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate links
        run: |
          BASE_URL="https://armorednightmare.github.io/arcdps_shares"

          # Define the markers as shell variables
          START_PATTERN=''
          END_PATTERN=''
          
          # --- DEBUG STEP REMAINS (Temporarily for confirmation) ---
          echo "### Starting Link Generation Debug ###"
          echo "Files Found (if any) and Links Generated (Latest on top):"

          # Use the link generation logic directly to print to the log
          # NOTE: The perl command is corrected to properly encode characters like spaces, [, and ].
          DEBUG_OUTPUT=$(find . -type f -name "*.html" ! -path "./.git/*" -printf '%T@\t%p\n' | sort -r -n | cut -f 2- | while read -r file; do
            relpath="${file#./}"
            
            # --- CORRECTED URL ENCODING ---
            # Encodes special URL characters (e.g., space, [, ], etc.)
            encoded=$(echo "$relpath" | perl -MURI::Escape -ne 'print uri_escape($_)')
            # -----------------------------
            
            echo "- [$relpath]($BASE_URL/$encoded)"
          done)
          
          echo "$DEBUG_OUTPUT"
          echo "### End Link Generation Debug ###"
          
          # Now, assign the content to LINKS for the awk step
          LINKS="$DEBUG_OUTPUT"

          # --- CRITICAL: Clean README.md for exact string matching ---
          sed -i '/AUTO-GENERATED-LIST/s/^[ \t]*//g; /AUTO-GENERATED-LIST/s/[ \t]*$//g' README.md

          # Abschnitt im README ersetzen: Robustes AWK mit variablen Mustern
          awk -v links="$LINKS" \
              -v start_pattern="$START_PATTERN" \
              -v end_pattern="$END_PATTERN" \
              '
            BEGIN {printlist=0}
            $0 == start_pattern {
              print; 
              print links; 
              printlist=1; 
              next
            }
            $0 == end_pattern {
              printlist=0; 
              print; 
              next
            }
            !printlist {print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README with HTML links"
