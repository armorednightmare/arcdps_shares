name: Update README with HTML links

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # wichtig, um commit-history für Datumsinfo zu haben

           - name: Generate links (sorted by commit date, newest first)
        run: |
          BASE_URL="https://armorednightmare.github.io/arcdps_shares"

          # Alle HTML-Dateien rekursiv sammeln und nach letztem Commit-Datum sortieren (neueste oben)
          LINKS=$(
            git ls-files '*.html' \
            | while read -r file; do
                date=$(git log -1 --format="%ct" -- "$file" || echo 0)
                echo "$date|$file"
              done \
            | sort -nr  \   # <-- neu: absteigend sortieren
            | while IFS="|" read -r date file; do
                relpath="$file"
                encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$relpath")
                echo "- [$relpath]($BASE_URL/$encoded)"
              done
          )

          # Abschnitt im README ersetzen
          awk -v links="$LINKS" '
            BEGIN {printlist=0}
            /<!-- AUTO-GENERATED-LIST:START -->/ {print; print links; printlist=1; next}
            /<!-- AUTO-GENERATED-LIST:END -->/ {printlist=0}
            !printlist {print}
          ' README.md > README.tmp && mv README.tmp README.md


      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README with HTML links (sorted chronologically)"
