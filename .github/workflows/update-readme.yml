name: Update README with HTML links

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Triggered when this workflow finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # erlaubt dem Bot, Änderungen zurückzuschreiben

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Only run the job if the triggering workflow ("pages-build-deployment") was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate links
        run: |
          BASE_URL="https://armorednightmare.github.io/arcdps_shares"

          # Define the markers as shell variables
          START_PATTERN=''
          END_PATTERN=''
          
          # --- 1. Restore Date Sorting ---
          # Finde HTML-Dateien, sortiere nach Änderungszeit (neueste zuerst) und generiere Markdown-Links
          LINKS=$(find . -type f -name "*.html" ! -path "./.git/*" -printf '%T@\t%p\n' | sort -r -n | cut -f 2- | while read -r file; do
            relpath="${file#./}"
            # URL-kodierte Variante für den Link
            encoded=$(printf "%s" "$relpath" | perl -pe 's/([^A-Za-z0-9_.-])/sprintf("%%%02X", ord($1))/g')
            echo "- [$relpath]($BASE_URL/$encoded)"
          done)

          # --- 2. Clean README.md (CRITICAL for exact string matching) ---
          # Use sed to remove leading/trailing whitespace from the marker lines in the README.
          # This ensures that $0 == start_pattern works correctly.
          sed -i '/AUTO-GENERATED-LIST/s/^[ \t]*//g; /AUTO-GENERATED-LIST/s/[ \t]*$//g' README.md

          # Abschnitt im README ersetzen: Robustes AWK mit variablen Mustern
          awk -v links="$LINKS" \
              -v start_pattern="$START_PATTERN" \
              -v end_pattern="$END_PATTERN" \
              '
            BEGIN {printlist=0}
            $0 == start_pattern { # Check if the current line ($0) exactly matches the start pattern
              print; 
              print links; 
              printlist=1; 
              next
            }
            $0 == end_pattern { # Check if the current line ($0) exactly matches the end pattern
              printlist=0; 
              print; 
              next
            }
            !printlist {print} # Only print lines outside the block
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README with HTML links"
