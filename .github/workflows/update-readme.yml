name: Update README with HTML links

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Triggered when this workflow finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # erlaubt dem Bot, Änderungen zurückzuschreiben

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Only run the job if the triggering workflow ("pages-build-deployment") was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate links
        run: |
          BASE_URL="https://armorednightmare.github.io/arcdps_shares"

          # 1. Alle .html-Dateien finden und den Git-Erstellungs-Timestamp abrufen
          #    --diff-filter=A: Zeigt nur Commits, in denen die Datei HINZUGEFÜGT (Added) wurde.
          #    | tail -1: Nimmt den ältesten/ersten Commit, d.h. den Erstellungs-Commit.
          #    | sort -k1,1nr: Sortiert nach dem Timestamp (neueste zuerst).
          FILE_DATA=$(git ls-files "*.html" -z | xargs -0 -I{} sh -c '
            relpath="$0"
            # Hole den Unix-Timestamp des ersten Commits (der Erstellung) der Datei
            timestamp=$(git log --follow --format="%at" --diff-filter=A -- "$relpath" | tail -1)
            
            # Wenn der Timestamp leer ist (z.B. bei nicht getrackten oder gelöschten Dateien, 
            # sollte hier aber nicht passieren), setzen wir 0, damit sort nicht fehlschlägt.
            if [ -z "$timestamp" ]; then
              timestamp=0
            fi
            
            echo "$timestamp $relpath"
          ' {} | sort -k1,1nr)

          # 2. Links aus den sortierten Daten generieren
          LINKS=$(echo "$FILE_DATA" | while read -r timestamp relpath; do
            # Nur Dateien verarbeiten, die einen gültigen Timestamp haben
            if [ "$timestamp" -ne 0 ] && [ ! -z "$relpath" ]; then
              # URL-kodierte Variante für den Link
              encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$relpath")
              echo "- [$relpath]($BASE_URL/$encoded)"
            fi
          done)

          # 3. Abschnitt im README ersetzen
          awk -v links="$LINKS" '
            BEGIN {printlist=0}
            /<!-- AUTO-GENERATED-LIST:START -->/ {print; print links; printlist=1; next}
            /<!-- AUTO-GENERATED-LIST:END -->/ {printlist=0}
            !printlist {print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README with HTML links"
